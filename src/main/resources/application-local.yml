spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3
    # https://docs.spring.io/spring-ai/reference/api/vectordbs/pgvector.html
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        batching-strategy: TOKEN_COUNT # Optional: Controls how documents are batched for embedding
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
        schema-name: core
  datasource:
    url: jdbc:postgresql://localhost:5432/aichat
    username: ${DB_USERNAME_AICHAT}
    password: ${DB_PASSWORD_AICHAT}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

web.cors.allowed-origins: http://localhost:3000

logging:
  level:
    org.springframework: INFO
    org.demo.ai.aichatdemo: DEBUG
    com.zaxxer.hikari: INFO
    org.springframework.jdbc: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
dir:
  inbuiltXpathFunctionDataDumpDir: in/inbuilt-xpath-functions
